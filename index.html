x<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PillTime</title>
<style>
  :root{
    --cream:#F6F3EC;
    --sage:#7C9885;
    --sage-dark:#5A7563;
    --navy:#233240;
    --gold:#D9A441;
    --coral:#E0654F;
    --white:#FFFFFF;
    --gray:#8A9299;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, sans-serif;
    background:var(--cream);
    color:var(--navy);
    min-height:100vh;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Profile picker ---------- */
  .picker{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    flex:1; padding:40px 20px; gap:28px;
  }
  .picker h1{font-size:2.2rem;margin-bottom:0;letter-spacing:0.5px;}
  .picker p{color:var(--gray);margin-top:4px;}
  .profile-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;margin-top:20px;}
  .profile-card{
    background:var(--white); border-radius:20px; padding:36px 40px;
    box-shadow:0 4px 18px rgba(35,50,64,0.10); cursor:pointer;
    text-align:center; width:220px; transition:transform .15s ease, box-shadow .15s ease;
    border:2px solid transparent;
  }
  .profile-card:hover{transform:translateY(-4px); box-shadow:0 8px 24px rgba(35,50,64,0.16); border-color:var(--sage);}
  .profile-card .icon{font-size:3.2rem;margin-bottom:10px;}
  .profile-card h2{margin:6px 0 4px 0;font-size:1.3rem;}
  .profile-card span{color:var(--gray);font-size:0.9rem;}

  /* ---------- Shared top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px; background:var(--white); box-shadow:0 2px 8px rgba(0,0,0,0.05);
  }
  .topbar h2{margin:0;font-size:1.2rem;}
  .back-btn, .logout-btn{
    background:none;border:1px solid var(--gray); color:var(--navy);
    padding:8px 16px;border-radius:10px;cursor:pointer;font-size:0.95rem;
  }
  .back-btn:hover, .logout-btn:hover{background:var(--cream);}

  /* ---------- Grandma view ---------- */
  .grandma-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:30px 20px;gap:20px;}
  .big-clock{font-size:3rem;font-weight:600;color:var(--sage-dark);}
  .tz-label{color:var(--gray);font-size:1rem;margin-top:-14px;}
  .med-list{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;}
  .med-card{
    background:var(--white);border-radius:16px;padding:20px 24px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 10px rgba(35,50,64,0.08);
  }
  .med-card .name{font-size:1.3rem;font-weight:600;}
  .med-card .time{font-size:1.1rem;color:var(--sage-dark);font-weight:600;}
  .med-card button{
    background:var(--gold);color:white;border:none;border-radius:10px;
    padding:10px 16px;font-size:0.95rem;cursor:pointer;
  }
  .add-med-form{
    width:100%;max-width:520px;background:var(--white);border-radius:16px;
    padding:20px 24px;box-shadow:0 2px 10px rgba(35,50,64,0.08);
    display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;
  }
  .add-med-form label{display:flex;flex-direction:column;font-size:0.85rem;color:var(--gray);gap:4px;flex:1;min-width:130px;}
  .add-med-form input{padding:10px;border-radius:8px;border:1px solid #ddd;font-size:1rem;}
  .add-med-form button{
    background:var(--sage);color:white;border:none;border-radius:10px;
    padding:12px 20px;font-size:1rem;cursor:pointer;height:44px;
  }

  /* ---------- Full-screen blocking alert ---------- */
  .alert-overlay{
    position:fixed;inset:0;background:var(--coral);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:999;color:white;text-align:center;padding:20px;
  }
  .alert-overlay .pill-icon{font-size:5rem;margin-bottom:10px;}
  .alert-overlay h1{font-size:2.4rem;margin:8px 0;}
  .alert-overlay p{font-size:1.3rem;margin:0 0 30px 0;}
  .alert-overlay button{
    background:white;color:var(--coral);border:none;border-radius:16px;
    padding:22px 48px;font-size:1.6rem;font-weight:700;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);
  }

  /* ---------- Login ---------- */
  .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;}
  .login-card{
    background:var(--white);border-radius:18px;padding:40px;width:320px;
    box-shadow:0 4px 18px rgba(35,50,64,0.12);
  }
  .login-card h2{margin-top:0;}
  .login-card input{
    width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;
    font-size:1rem;margin-bottom:14px;
  }
  .login-card button{
    width:100%;padding:12px;border-radius:10px;border:none;
    background:var(--navy);color:white;font-size:1rem;cursor:pointer;
  }
  .hint{color:var(--gray);font-size:0.8rem;margin-top:10px;}
  .error{color:var(--coral);font-size:0.85rem;margin:-8px 0 12px 0;}

  /* ---------- Caregiver dashboard ---------- */
  .dash-wrap{flex:1;padding:24px;max-width:900px;margin:0 auto;width:100%;}
  .section{
    background:var(--white);border-radius:16px;padding:22px 26px;
    box-shadow:0 2px 10px rgba(35,50,64,0.08);margin-bottom:24px;
  }
  .section h3{margin-top:0;}
  .tz-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
  .tz-row select{padding:10px;border-radius:8px;border:1px solid #ddd;font-size:0.95rem;}
  .tz-compare{
    background:var(--cream);border-radius:10px;padding:12px 16px;
    font-size:0.95rem;color:var(--navy);margin-top:14px;
  }
  table{width:100%;border-collapse:collapse;margin-top:10px;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee;font-size:0.92rem;}
  th{color:var(--gray);font-weight:600;font-size:0.82rem;text-transform:uppercase;letter-spacing:0.4px;}
  .remove-btn{background:none;border:1px solid var(--coral);color:var(--coral);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:0.85rem;}
  .dash-add{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;}
  .dash-add input{padding:10px;border-radius:8px;border:1px solid #ddd;font-size:0.95rem;flex:1;min-width:120px;}
  .dash-add button{background:var(--sage);color:white;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;}

  .adherence-grid{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
  .adherence-row{display:flex;align-items:center;gap:10px;}
  .adherence-row .med-name{width:130px;font-weight:600;font-size:0.9rem;}
  .day-cell{
    width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:0.75rem;color:white;font-weight:600;
  }
  .taken{background:var(--sage);}
  .missed{background:var(--coral);}
  .pending{background:#E4E1D8;color:var(--gray);}
  .day-labels{display:flex;gap:10px;margin-left:140px;}
  .day-labels span{width:34px;text-align:center;font-size:0.72rem;color:var(--gray);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ IN-MEMORY STATE (prototype only, resets on reload) ============ */
const TIMEZONES = [
  "America/Los_Angeles","America/Denver","America/Chicago","America/New_York",
  "America/Sao_Paulo","Europe/London","Europe/Paris","Europe/Berlin",
  "Asia/Singapore","Asia/Tokyo","Asia/Kolkata","Australia/Sydney"
];

let state = {
  screen: "select", // select | grandma | caregiverLogin | caregiverDashboard
  loginError: "",
  activeAlert: null, // med id currently blocking screen
  grandma: {
    timezone: "Asia/Singapore",
    meds: [
      { id: 1, name: "Blood Pressure Pill", time: "08:00", log: {} },
      { id: 2, name: "Vitamin D", time: "20:00", log: {} }
    ]
  },
  caregiver: {
    password: "1234",
    timezone: "America/New_York",
    loggedIn: false
  },
  nextId: 3
};

function todayKey(tz){
  return new Date().toLocaleDateString("en-CA", { timeZone: tz }); // YYYY-MM-DD
}

function currentTimeInTz(tz){
  return new Date().toLocaleTimeString("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit" });
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";

  if (state.screen === "select") app.appendChild(renderPicker());
  if (state.screen === "grandma") app.appendChild(renderGrandma());
  if (state.screen === "caregiverLogin") app.appendChild(renderLogin());
  if (state.screen === "caregiverDashboard") app.appendChild(renderDashboard());

  if (state.activeAlert){
    app.appendChild(renderAlert());
  }
}

/* ============ PROFILE PICKER ============ */
function renderPicker(){
  const wrap = document.createElement("div");
  wrap.className = "picker";
  wrap.innerHTML = `
    <h1>PillTime</h1>
    <p>Who's using the app?</p>
    <div class="profile-row">
      <div class="profile-card" id="pick-grandma">
        <div class="icon">👵</div>
        <h2>Grandma</h2>
        <span>No login needed</span>
      </div>
      <div class="profile-card" id="pick-caregiver">
        <div class="icon">🩺</div>
        <h2>Caregiver</h2>
        <span>Login required</span>
      </div>
    </div>
  `;
  wrap.querySelector("#pick-grandma").onclick = () => { state.screen = "grandma"; render(); };
  wrap.querySelector("#pick-caregiver").onclick = () => { state.screen = "caregiverLogin"; state.loginError=""; render(); };
  return wrap;
}

/* ============ GRANDMA VIEW ============ */
function renderGrandma(){
  const wrap = document.createElement("div");
  wrap.style.display = "flex";
  wrap.style.flexDirection = "column";
  wrap.style.flex = "1";

  const top = document.createElement("div");
  top.className = "topbar";
  top.innerHTML = `<h2>👵 Grandma's Medications</h2>`;
  const backBtn = document.createElement("button");
  backBtn.className = "back-btn";
  backBtn.textContent = "← Switch profile";
  backBtn.onclick = () => { state.screen = "select"; render(); };
  top.appendChild(backBtn);
  wrap.appendChild(top);

  const body = document.createElement("div");
  body.className = "grandma-wrap";

  const clock = document.createElement("div");
  clock.className = "big-clock";
  clock.id = "grandma-clock";
  clock.textContent = currentTimeInTz(state.grandma.timezone);
  body.appendChild(clock);

  const tzLabel = document.createElement("div");
  tzLabel.className = "tz-label";
  tzLabel.textContent = state.grandma.timezone.replace("_"," ");
  body.appendChild(tzLabel);

  const list = document.createElement("div");
  list.className = "med-list";
  state.grandma.meds.forEach(med => {
    const key = todayKey(state.grandma.timezone);
    const takenToday = med.log[key];
    const card = document.createElement("div");
    card.className = "med-card";
    card.innerHTML = `
      <div>
        <div class="name">${escapeHtml(med.name)}</div>
        <div class="time">${med.time} ${takenToday ? "✅ taken today" : ""}</div>
      </div>
    `;
    const testBtn = document.createElement("button");
    testBtn.textContent = "Trigger now (demo)";
    testBtn.onclick = () => { state.activeAlert = med.id; render(); };
    card.appendChild(testBtn);
    list.appendChild(card);
  });
  body.appendChild(list);

  const form = document.createElement("div");
  form.className = "add-med-form";
  form.innerHTML = `
    <label>Medication name
      <input type="text" id="new-med-name" placeholder="e.g. Aspirin">
    </label>
    <label>Time
      <input type="time" id="new-med-time" value="09:00">
    </label>
  `;
  const addBtn = document.createElement("button");
  addBtn.textContent = "+ Add medication";
  addBtn.onclick = () => {
    const name = document.getElementById("new-med-name").value.trim();
    const time = document.getElementById("new-med-time").value;
    if (!name || !time) return;
    state.grandma.meds.push({ id: state.nextId++, name, time, log: {} });
    render();
  };
  form.appendChild(addBtn);
  body.appendChild(form);

  wrap.appendChild(body);
  return wrap;
}

function renderAlert(){
  const med = state.grandma.meds.find(m => m.id === state.activeAlert);
  const overlay = document.createElement("div");
  overlay.className = "alert-overlay";
  overlay.innerHTML = `
    <div class="pill-icon">💊</div>
    <h1>Time to take your medication</h1>
    <p>${escapeHtml(med.name)} — ${med.time}</p>
  `;
  const btn = document.createElement("button");
  btn.textContent = "I took it ✓";
  btn.onclick = () => {
    const key = todayKey(state.grandma.timezone);
    med.log[key] = true;
    state.activeAlert = null;
    render();
  };
  overlay.appendChild(btn);
  return overlay;
}

/* ============ CAREGIVER LOGIN ============ */
function renderLogin(){
  const wrap = document.createElement("div");
  wrap.style.display = "flex";
  wrap.style.flexDirection = "column";
  wrap.style.flex = "1";

  const top = document.createElement("div");
  top.className = "topbar";
  top.innerHTML = `<h2>🩺 Caregiver Login</h2>`;
  const backBtn = document.createElement("button");
  backBtn.className = "back-btn";
  backBtn.textContent = "← Switch profile";
  backBtn.onclick = () => { state.screen = "select"; render(); };
  top.appendChild(backBtn);
  wrap.appendChild(top);

  const loginWrap = document.createElement("div");
  loginWrap.className = "login-wrap";
  loginWrap.innerHTML = `
    <div class="login-card">
      <h2>Sign in</h2>
      ${state.loginError ? `<div class="error">${state.loginError}</div>` : ""}
      <input type="text" id="cg-username" placeholder="Username (any value)">
      <input type="password" id="cg-password" placeholder="Password">
    </div>
  `;
  const card = loginWrap.querySelector(".login-card");
  const btn = document.createElement("button");
  btn.textContent = "Log in";
  btn.onclick = () => {
    const pw = document.getElementById("cg-password").value;
    if (pw === state.caregiver.password){
      state.caregiver.loggedIn = true;
      state.loginError = "";
      state.screen = "caregiverDashboard";
    } else {
      state.loginError = "Incorrect password. Try again.";
    }
    render();
  };
  card.appendChild(btn);
  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = "Demo password: " + state.caregiver.password;
  card.appendChild(hint);

  loginWrap.appendChild(card);
  wrap.appendChild(loginWrap);
  return wrap;
}

/* ============ CAREGIVER DASHBOARD ============ */
function renderDashboard(){
  const wrap = document.createElement("div");
  wrap.style.display = "flex";
  wrap.style.flexDirection = "column";
  wrap.style.flex = "1";

  const top = document.createElement("div");
  top.className = "topbar";
  top.innerHTML = `<h2>🩺 Caregiver Dashboard</h2>`;
  const logoutBtn = document.createElement("button");
  logoutBtn.className = "logout-btn";
  logoutBtn.textContent = "Log out";
  logoutBtn.onclick = () => {
    state.caregiver.loggedIn = false;
    state.screen = "select";
    render();
  };
  top.appendChild(logoutBtn);
  wrap.appendChild(top);

  const dash = document.createElement("div");
  dash.className = "dash-wrap";

  // --- Timezone section ---
  const tzSection = document.createElement("div");
  tzSection.className = "section";
  tzSection.innerHTML = `<h3>Timezones</h3>`;
  const tzRow = document.createElement("div");
  tzRow.className = "tz-row";
  tzRow.innerHTML = `
    <label>Your timezone:
      <select id="cg-tz">
        ${TIMEZONES.map(tz => `<option value="${tz}" ${tz===state.caregiver.timezone?"selected":""}>${tz.replace("_"," ")}</option>`).join("")}
      </select>
    </label>
    <label>Grandma's timezone:
      <select id="grandma-tz">
        ${TIMEZONES.map(tz => `<option value="${tz}" ${tz===state.grandma.timezone?"selected":""}>${tz.replace("_"," ")}</option>`).join("")}
      </select>
    </label>
  `;
  tzSection.appendChild(tzRow);
  const compare = document.createElement("div");
  compare.className = "tz-compare";
  compare.id = "tz-compare";
  tzSection.appendChild(compare);
  dash.appendChild(tzSection);

  function updateCompare(){
    const now = new Date();
    compare.textContent =
      `Right now it's ${currentTimeInTz(state.caregiver.timezone)} for you, and ` +
      `${currentTimeInTz(state.grandma.timezone)} for grandma.`;
  }
  updateCompare();

  tzRow.querySelector("#cg-tz").onchange = (e) => {
    state.caregiver.timezone = e.target.value;
    updateCompare();
  };
  tzRow.querySelector("#grandma-tz").onchange = (e) => {
    state.grandma.timezone = e.target.value;
    updateCompare();
    render();
  };

  // --- Medication management ---
  const medSection = document.createElement("div");
  medSection.className = "section";
  medSection.innerHTML = `<h3>Medications</h3>`;
  const table = document.createElement("table");
  table.innerHTML = `
    <tr><th>Name</th><th>Time (grandma's tz)</th><th></th></tr>
    ${state.grandma.meds.map(m => `
      <tr>
        <td>${escapeHtml(m.name)}</td>
        <td>${m.time}</td>
        <td><button class="remove-btn" data-id="${m.id}">Remove</button></td>
      </tr>
    `).join("")}
  `;
  table.querySelectorAll(".remove-btn").forEach(btn => {
    btn.onclick = () => {
      const id = Number(btn.dataset.id);
      state.grandma.meds = state.grandma.meds.filter(m => m.id !== id);
      render();
    };
  });
  medSection.appendChild(table);

  const addRow = document.createElement("div");
  addRow.className = "dash-add";
  addRow.innerHTML = `
    <input type="text" id="dash-med-name" placeholder="Medication name">
    <input type="time" id="dash-med-time" value="09:00">
  `;
  const addBtn = document.createElement("button");
  addBtn.textContent = "+ Add";
  addBtn.onclick = () => {
    const name = document.getElementById("dash-med-name").value.trim();
    const time = document.getElementById("dash-med-time").value;
    if (!name || !time) return;
    state.grandma.meds.push({ id: state.nextId++, name, time, log: {} });
    render();
  };
  addRow.appendChild(addBtn);
  medSection.appendChild(addRow);
  dash.appendChild(medSection);

  // --- Adherence tracker (last 7 days) ---
  const adhSection = document.createElement("div");
  adhSection.className = "section";
  adhSection.innerHTML = `<h3>Adherence — last 7 days</h3>`;

  const days = [];
  for (let i = 6; i >= 0; i--){
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  const dayLabels = document.createElement("div");
  dayLabels.className = "day-labels";
  dayLabels.innerHTML = days.map(d => `<span>${d.toLocaleDateString("en-US",{weekday:"short"})}</span>`).join("");
  adhSection.appendChild(dayLabels);

  const grid = document.createElement("div");
  grid.className = "adherence-grid";
  state.grandma.meds.forEach(med => {
    const row = document.createElement("div");
    row.className = "adherence-row";
    const label = document.createElement("div");
    label.className = "med-name";
    label.textContent = med.name;
    row.appendChild(label);
    days.forEach(d => {
      const key = d.toLocaleDateString("en-CA", { timeZone: state.grandma.timezone });
      const isToday = key === todayKey(state.grandma.timezone);
      const cell = document.createElement("div");
      const taken = med.log[key];
      cell.className = "day-cell " + (taken ? "taken" : (isToday ? "pending" : "missed"));
      cell.textContent = taken ? "✓" : (isToday ? "…" : "✕");
      row.appendChild(cell);
    });
    grid.appendChild(row);
  });
  adhSection.appendChild(grid);
  dash.appendChild(adhSection);

  wrap.appendChild(dash);
  return wrap;
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

/* ============ CLOCK + MED CHECK LOOP ============ */
setInterval(() => {
  if (state.screen === "grandma"){
    const clockEl = document.getElementById("grandma-clock");
    if (clockEl) clockEl.textContent = currentTimeInTz(state.grandma.timezone);
  }
  // check for meds due right now
  if (!state.activeAlert){
    const nowStr = currentTimeInTz(state.grandma.timezone); // "HH:MM"
    const key = todayKey(state.grandma.timezone);
    const due = state.grandma.meds.find(m => m.time === nowStr && !m.log[key]);
    if (due){
      state.activeAlert = due.id;
      render();
    }
  }
}, 1000 * 10); // check every 10s (prototype)

render();
</script>
</body>
</html>
